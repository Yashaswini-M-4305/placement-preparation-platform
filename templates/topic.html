{% extends "base.html" %}
{% block title %}{{ topic }}{% endblock %}

{% block content %}

<h2 class="mb-3">{{ topic }} – Practice</h2>

<!-- Progress Card -->
<div class="card p-3 mb-3">
  <h5>Progress: {{ done }} / {{ total }}</h5>

  <div class="progress">
    <div class="progress-bar bg-info"
         style="width: {{ percent }}%">
      {{ percent }}%
    </div>
  </div>
</div>


<!-- Add Question -->
<div class="card p-3 mb-3">
  <form method="POST" action="/add-question">
    <input type="hidden" name="topic" value="{{ topic }}">

    <input class="form-control mb-2"
           name="title"
           placeholder="Question name">

    <input class="form-control mb-2"
           name="link"
           placeholder="Leetcode / GFG link (optional)">

    <button class="btn btn-primary">
      Add Question
    </button>
  </form>
</div>


<!-- Question List -->
<div class="card p-3">
{% for q in questions %}
  <div class="form-check mb-2">
    <input class="form-check-input"
           type="checkbox"
           {% if q.solved %}checked{% endif %}
           onchange="toggleQuestion({{ q.id }}, this.checked)">

    <label class="form-check-label">
      {% if q.link %}
        <a href="{{ q.link }}" target="_blank">
          {{ q.title }}
        </a>
      {% else %}
        {{ q.title }}
      {% endif %}
    </label>
  </div>
{% endfor %}
</div>


<script>
function toggleQuestion(id, solved) {
  fetch("/toggle-question", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: `id=${id}&solved=${solved}`
  })
  .then(() => location.reload());
}
</script>

{% endblock %}
