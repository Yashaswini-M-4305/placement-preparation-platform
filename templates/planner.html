{% extends "base.html" %}
{% block title %}Daily Planner{% endblock %}

{% block content %}
<h2 class="mb-4">📅 Daily Study Planner</h2>

<!-- Date Selector -->
<form method="GET" class="mb-3">
  <input
    type="date"
    name="date"
    value="{{ selected_date }}"
    class="form-control w-25"
    onchange="this.form.submit()"
  >
</form>

<!-- Add Task -->
<form method="POST" action="{{ url_for('add_plan') }}" class="d-flex mb-3">
  <input type="hidden" name="date" value="{{ selected_date }}">
  <input
    type="text"
    name="task"
    class="form-control me-2"
    placeholder="Enter today's task"
    required
  >
  <button class="btn btn-primary">Add</button>
</form>

<!-- Tasks List -->
<ul class="list-group">
  {% for plan in plans %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      
      <div>
        <input
          type="checkbox"
          {% if plan.completed %}checked{% endif %}
          onchange="togglePlan({{ plan.id }})"
        >
        <span class="{% if plan.completed %}text-decoration-line-through{% endif %}">
          {{ plan.task }}
        </span>
      </div>

      <button
        class="btn btn-sm btn-outline-danger"
        onclick="deletePlan({{ plan.id }})"
      >
        🗑️
      </button>

    </li>
  {% else %}
    <li class="list-group-item text-muted">No tasks for this day</li>
  {% endfor %}
</ul>

<script>
function togglePlan(id) {
  fetch("/toggle-plan", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "id=" + id
  }).then(() => location.reload());
}
</script>
<script>
function deletePlan(id) {
  if (!confirm("Delete this task?")) return;

  fetch("/delete-plan", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: `id=${id}`
  })
  .then(res => res.json())
  .then(() => location.reload());
}

function togglePlan(id) {
  fetch("/toggle-plan", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: `id=${id}`
  });
}
</script>

{% endblock %}
