{% extends "base.html" %}
{% block title %}Daily Planner{% endblock %}

{% block content %}
<h2 class="mb-4">📅 Daily Study Planner</h2>

<!-- Date Selector -->
<form method="GET" class="mb-3">
  <input
    type="date"
    name="date"
    value="{{ selected_date }}"
    class="form-control w-25"
    onchange="this.form.submit()"
  >
</form>

<!-- Add Task -->
<form method="POST" action="{{ url_for('add_plan') }}" class="d-flex mb-3">
  <input type="hidden" name="date" value="{{ selected_date }}">
  <input
    type="text"
    name="task"
    class="form-control me-2"
    placeholder="Enter today's task"
    required
  >
  <button class="btn btn-primary">Add</button>
</form>

<!-- Tasks List -->
<ul class="list-group">
{% for p in plans %}
  <li class="list-group-item d-flex justify-content-between">
    
    <div>
      <input type="checkbox"
             onchange="togglePlan({{ p.id }})"
             {% if p.completed %}checked{% endif %}>
      {{ p.task }}
    </div>

    <form action="/delete-plan" method="POST">
      <input type="hidden" name="id" value="{{ p.id }}">
      <button class="btn btn-sm btn-danger">
        Delete
      </button>
    </form>

  </li>
{% endfor %}
</ul>


<script>
function togglePlan(id) {
  fetch("/toggle-plan", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "id=" + id
  }).then(() => location.reload());
}
</script>
<script>
function deletePlan(id) {
  if (!confirm("Delete this task?")) return;

  fetch("/delete-plan", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: `id=${id}`
  })
  .then(res => res.json())
  .then(() => location.reload());
}

function togglePlan(id) {
  fetch("/toggle-plan", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: `id=${id}`
  });
}
</script>
<script>
function togglePlan(id) {
  fetch("/toggle-plan/" + id, { method: "POST" })
    .then(() => location.reload());
}
</script>

{% endblock %}
